name: v2_baseline_aggressive
description: Baseline agresivo (max-div cov45, cap5, gross 1.2, beta hedge, prop_tight, confidence long-only)
references:
  data_config: configs/data/binance_daily.yaml
  backtest_config: configs/backtest/daily_default.yaml

universe:
  type: pit_csv
  path: data/processed/universe/v0b
  rebalance_freq: 1M
  liquidity_lookback_days: 30

signal:
  type: momentum
  lookback_days: 21
  annualize: false

portfolio:
  long_short:
    enabled: true
    long_selection_pct: 0.2
    short_selection_pct: 0.2
    weighting: max_div
    gross_leverage: 1.2
    max_weight_pct: null
    dynamic_percentiles: null
    beta_neutralize:
      benchmark: BTCUSDT
      lookback_days: 60
  selection_top_pct: 0.2
  weighting: max_div
  rebalance_freq: 1W
  vol_lookback_days: 45
  cash_buffer_pct: 0.0
  cap_pct: 0.05
  confidence_scale:
    enabled: true
    min_scale: 0.9
    max_scale: 1.1
    clip_z: 2.5
    dd_floor: 0.9
    dd_ceiling: 1.05
    long_only: true

execution:
  commission_pct: 0.0004
  slippage_alpha: 0.001

risk_overlay:
  enabled: true
  target_vol_annual: 10.0
  vol_window_periods: 0
  periods_per_year: 52
  max_gross_leverage: 1.0
  dd_trigger: 2.0
  dd_hard: 3.0
  dd_trigger_scale: 1.0
  min_scale: 1.0
  meta_label:
    enabled: false
  ic_gating:
    enabled: false
  prop_constraints:
    enabled: true
    loss_limit_pct: 0.03
    cooloff_periods: 2
    equity_stop_pct: 0.30

regime:
  enabled: false

backtest:
  start_date: 2019-11-15
  end_date: 2025-07-01
  initial_capital: 10000
